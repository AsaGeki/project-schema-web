# Pacotes liberados a rodar script de instalação. O pnpm ignora build script por
# padrão; sem esta lista o client do Prisma não é gerado e o esbuild fica sem binário.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  bcrypt: true
  esbuild: true
  unrs-resolver: true
